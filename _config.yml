# GitHub Pages publishes the storefront only. Source, notes and server code stay in the repo but aren't served.
exclude:
  - README.md
  - CHANGELOG.md
  - supabase-setup.sql
  - STAGING.md
  - staging.config.example.json
  - ai-proxy.worker.js
  - supabase
  - tools
  - docs
  - .claude
  - .gitignore
include:
  - .well-known
plugins: []
